# Supabase project config (CLI). After `supabase link --project-ref <ref>`
# the CLI fills in the rest; only the parts we must control are pinned here.

project_id = "autoverkauf"

# Stripe cannot send Supabase JWTs — these functions authenticate themselves
# (webhook signature / HMAC accept token / x-admin-key).
[functions.stripe-webhook]
verify_jwt = false

[functions.accept-offer]
verify_jwt = false

[functions.onboard-garage]
verify_jwt = false

[functions.process-stripe-jobs]
verify_jwt = false
